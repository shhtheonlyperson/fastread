name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios-performance:
    name: iOS and performance guardrails
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      FASTREAD_PERF_BUDGET_MULTIPLIER: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check source guardrails
        run: scripts/check-source-guardrails.sh

      - name: Run Swift unit tests
        run: swift test

      - name: Run Swift core verifier
        run: swift run FastReadCoreVerifier

      - name: Run Swift performance stress tests
        run: swift run FastReadPerformanceVerifier

      - name: Build Release iOS app
        run: xcodebuild -project FastRead.xcodeproj -scheme FastRead -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
