name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios-performance:
    name: iOS and performance guardrails
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      FASTREAD_PERF_BUDGET_MULTIPLIER: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run native, web, stress, and Release build checks
        run: npm run verify:ios-performance
