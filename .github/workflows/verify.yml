name: Verify

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rsvp-spec:
    name: Shared RSVP spec drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify generated RSVP spec is in sync
        run: scripts/verify-rsvp-spec.sh

  ios-performance:
    name: iOS and performance guardrails
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      FASTREAD_PERF_BUDGET_MULTIPLIER: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check source guardrails
        run: scripts/check-source-guardrails.sh

      - name: Run Swift unit tests
        run: swift test

      - name: Run Swift core verifier
        run: swift run FastReadCoreVerifier

      - name: Run Swift performance stress tests
        run: swift run FastReadPerformanceVerifier

      - name: Build Release iOS app
        run: xcodebuild -project FastRead.xcodeproj -scheme FastRead -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  chrome-extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        working-directory: chrome-ext
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: chrome-ext
        run: bun run typecheck

      - name: Run unit tests
        working-directory: chrome-ext
        run: bun run test

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Android unit tests
        working-directory: android-spike
        run: ./gradlew :app:testDebugUnitTest
