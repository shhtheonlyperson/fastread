name: FastRead
options:
  bundleIdPrefix: com.shh
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FastRead:
    type: application
    platform: iOS
    sources:
      - path: FastReadApp
      - path: Sources/FastReadCore
    resources:
      - path: FastReadApp/Assets.xcassets
      - path: FastReadApp/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shh.fastread
        PRODUCT_NAME: JustRead
        INFOPLIST_FILE: FastReadApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
