<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FastRead</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>FastRead</h1>
          <p id="stats" class="stats">0 words</p>
        </div>
        <div class="speed-control">
          <label for="wpm">WPM</label>
          <input id="wpm" type="range" min="100" max="1200" step="25" value="650" />
          <output id="wpm-value" for="wpm">650</output>
        </div>
      </header>

      <section class="workspace" aria-label="Fast reading workspace">
        <section class="input-panel" aria-label="Input">
          <div class="panel-heading">
            <h2>Input</h2>
            <button id="clear-text" class="text-button" type="button">Clear</button>
          </div>
          <form id="url-form" class="url-form">
            <label for="url-input">URL</label>
            <input id="url-input" type="url" placeholder="https://example.com/article" autocomplete="url" />
            <button id="load-url" class="text-button" type="submit">Load</button>
          </form>
          <p id="url-status" class="url-status" role="status"></p>
          <div class="epub-row">
            <label for="epub-input" class="text-button" id="epub-label">Pick EPUB</label>
            <input id="epub-input" type="file" accept=".epub,application/epub+zip" hidden />
            <span id="epub-status" class="url-status" role="status"></span>
          </div>
          <textarea id="text-input" spellcheck="false" placeholder="Paste an article, memo, or transcript here."></textarea>
          <label class="toggle">
            <input id="punctuation-pause" type="checkbox" checked />
            <span>Pause on punctuation</span>
          </label>
        </section>

        <section class="reader-panel" aria-label="Reader">
          <div class="reader-stage" aria-live="polite" aria-atomic="true">
            <span id="word-left" class="word-left"></span>
            <span id="word-focus" class="word-focus"></span>
            <span id="word-right" class="word-right"></span>
          </div>

          <div class="transport" aria-label="Playback controls">
            <button id="previous-word" class="icon-button" type="button" aria-label="Previous word" title="Previous word">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM18 6v12L9 12z" /></svg>
            </button>
            <button id="play-pause" class="primary-button" type="button" aria-label="Play" title="Play">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            </button>
            <button id="next-word" class="icon-button" type="button" aria-label="Next word" title="Next word">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM6 6v12l9-6z" /></svg>
            </button>
            <button id="reset-reader" class="icon-button" type="button" aria-label="Reset" title="Reset">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h8.2a5 5 0 1 1-3.5 8.5l1.4-1.4A3 3 0 1 0 15.2 9H7v3L3 8l4-4z" /></svg>
            </button>
            <button id="focus-mode" class="icon-button" type="button" aria-label="Focus mode" title="Focus mode">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9H3V3h6v2H5zM21 9h-2V5h-4V3h6zM9 21H3v-6h2v4h4zM21 21h-6v-2h4v-4h2z" /></svg>
            </button>
          </div>

          <div class="progress-row">
            <input id="progress" type="range" min="0" max="0" value="0" aria-label="Reading progress" />
            <span id="progress-text">0 / 0</span>
          </div>
        </section>
      </section>

      <section class="preview-panel" aria-label="Focus-marked text">
        <div class="panel-heading">
          <h2>Focus Text</h2>
          <div class="button-row">
            <button id="copy-text" class="text-button" type="button">Copy Text</button>
            <button id="copy-html" class="text-button" type="button">Copy HTML</button>
          </div>
        </div>
        <div id="focus-preview" class="focus-preview"></div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
